<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>awesome calculator</title>
    <base href="https://testingcf.jsdelivr.net/gh/aDiesmos/royred/clc/">

    <style>
html, body, #canvas {
    margin: 0;
    padding: 0;
    border: 0;
}
body {
    color: white;
    background-color: black;
    overflow: hidden;
    touch-action: none;
}
#canvas {
    display: block;
}
#canvas:focus {
    outline: none;
}
#status, #status-splash, #status-progress {
    position: absolute;
    left: 0;
    right: 0;
}
#status, #status-splash {
    top: 0;
    bottom: 0;
}
#status {
    background-color: #c0c4c4;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    visibility: hidden;
}
#status-splash {
    max-height: 100%;
    max-width: 100%;
    margin: auto;
}
#status-splash.show-image--false { display: none; }
#status-splash.fullsize--false { height: 100%; width: 100%; object-fit: contain; }
#status-progress, #status-notice { display: none; }
#status-progress {
    bottom: 10%;
    width: 50%;
    margin: 0 auto;
}
#status-notice {
    background-color: #5b3943;
    border-radius: 0.5rem;
    border: 1px solid #9b3943;
    color: #e0e0e0;
    font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
    line-height: 1.3;
    margin: 0 2rem;
    overflow: hidden;
    padding: 1rem;
    text-align: center;
    z-index: 1;
}
    </style>

    <link id="-gd-engine-icon" rel="icon" type="image/png" href="awesome calculator.icon.png" />
    <link rel="apple-touch-icon" href="awesome calculator.apple-touch-icon.png"/>

</head>

<body>

    <!-- MULTIPART LOADER -->
    <script src="main.js"></script>

    <canvas id="canvas">Your browser does not support the canvas tag.</canvas>

    <noscript>Your browser does not support JavaScript.</noscript>

    <div id="status">
        <img id="status-splash" class="show-image--true fullsize--false use-filter--true"
             src="awesome calculator.png" alt="">
        <progress id="status-progress"></progress>
        <div id="status-notice"></div>
    </div>

    <!-- GODOT ENGINE -->
    <script src="awesome calculator.js"></script>

    <!-- ENGINE STARTER (called *after* main.js merges parts) -->
    <script>
const GODOT_CONFIG = {
    "args": [],
    "canvasResizePolicy": 2,
    "emscriptenPoolSize": 8,
    "ensureCrossOriginIsolationHeaders": true,
    "executable": "awesome calculator",
    "experimentalVK": false,
    "fileSizes": {
        "awesome calculator.pck": 15620136,
        "awesome calculator.wasm": 38034280
    },
    "focusCanvas": true,
    "gdextensionLibs": [],
    "godotPoolSize": 4
};

const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

function godotRunStart() {
    const statusOverlay = document.getElementById('status');
    const statusProgress = document.getElementById('status-progress');
    const statusNotice = document.getElementById('status-notice');

    let initializing = true;
    let statusMode = '';

    function setStatusMode(mode) {
        if (statusMode === mode || !initializing) return;
        if (mode === 'hidden') {
            statusOverlay.remove();
            initializing = false;
            return;
        }
        statusOverlay.style.visibility = 'visible';
        statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
        statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
        statusMode = mode;
    }

    function setStatusNotice(text) {
        statusNotice.innerHTML = "";
        for (const l of text.split("\n")) {
            statusNotice.appendChild(document.createTextNode(l));
            statusNotice.appendChild(document.createElement("br"));
        }
    }

    function displayFailure(err) {
        console.error(err);
        setStatusNotice(err.message ?? String(err));
        setStatusMode("notice");
        initializing = false;
    }

    const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

    if (missing.length !== 0) {
        displayFailure("Error\nMissing features:\n" + missing.join("\n"));
        return;
    }

    setStatusMode("progress");

    engine.startGame({
        onProgress: (cur, total) => {
            if (cur > 0 && total > 0) {
                statusProgress.value = cur;
                statusProgress.max = total;
            } else {
                statusProgress.removeAttribute('value');
                statusProgress.removeAttribute('max');
            }
        }
    }).then(() => setStatusMode("hidden"))
      .catch(displayFailure);
}

window.godotRunStart = godotRunStart;
    </script>

</body>
</html>
